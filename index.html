<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Judah & 28th Ave Departures</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: #050505;
      color: #ffd400;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }

    body {
      padding: 10px;
    }

    .board {
      width: 100%;
      height: 100%;
      border: 3px solid #222;
      border-radius: 18px;
      background: #080808;
      box-shadow: 0 0 35px rgba(255, 212, 0, 0.14);
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #ffd400;
      color: #000;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-shrink: 0;
    }

    .title {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: -0.5px;
      line-height: 1;
    }

    .subtitle {
      font-size: 12px;
      font-weight: 800;
      opacity: 0.75;
      margin-top: 3px;
    }

    .live {
      background: #000;
      color: #ffd400;
      padding: 7px 12px;
      border-radius: 999px;
      font-weight: 900;
      font-size: 13px;
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #ff2b2b;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }

    .info-bar {
      padding: 7px 14px;
      border-bottom: 1px solid #222;
      color: #aaa;
      font-size: 11px;
      display: flex;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .departures {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .row {
      flex: 1;
      display: grid;
      grid-template-columns: 86px 1fr 112px;
      gap: 14px;
      padding: 10px 16px;
      border-bottom: 1px solid #1e1e1e;
      align-items: center;
      min-height: 0;
    }

    .row:last-child {
      border-bottom: none;
    }

    .route {
      background: #ffd400;
      color: #000;
      font-size: 26px;
      font-weight: 900;
      text-align: center;
      padding: 9px 8px;
      border-radius: 13px;
      min-width: 64px;
      box-shadow: 0 0 18px rgba(255, 212, 0, 0.14);
    }

    .route.n-route {
      background: #005bbb;
      color: white;
      box-shadow: 0 0 22px rgba(0, 91, 187, 0.45);
    }

    .main {
      min-width: 0;
    }

    .destination {
      font-size: 28px;
      font-weight: 900;
      color: #ffd400;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.05;
    }

    .details {
      margin-top: 5px;
      font-size: 13px;
      font-weight: 800;
      color: #aaa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .mins {
      font-size: 30px;
      font-weight: 900;
      color: #ffd400;
      text-align: right;
      white-space: nowrap;
    }

    .due {
      color: #00ff88;
    }

    .empty,
    .error {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 22px;
      color: #aaa;
      font-size: 20px;
      font-weight: 800;
    }

    .error {
      color: #ff6b6b;
    }

    @media (max-height: 430px) {
      body {
        padding: 7px;
      }

      .header {
        padding: 8px 14px;
      }

      .title {
        font-size: 21px;
      }

      .subtitle {
        display: none;
      }

      .info-bar {
        padding: 5px 12px;
      }

      .row {
        padding: 8px 14px;
        grid-template-columns: 76px 1fr 104px;
      }

      .route {
        font-size: 23px;
        padding: 7px;
      }

      .destination {
        font-size: 25px;
      }

      .details {
        font-size: 12px;
      }

      .mins {
        font-size: 27px;
      }
    }
  </style>
</head>

<body>
  <main class="board">
    <header class="header">
      <div>
        <div class="title">Judah & 28th Ave</div>
        <div class="subtitle">Live SFMTA departures</div>
      </div>

      <div class="live">
        <span class="dot"></span>
        LIVE
      </div>
    </header>

    <section class="info-bar">
      <div id="status">Loading…</div>
      <div id="updated">Updated: —</div>
    </section>

    <section class="departures" id="departuresList">
      <div class="empty">Loading departures…</div>
    </section>
  </main>

  <script>
    const API_URL = "https://judah-28th-api.261bayley.workers.dev/";
    const REFRESH_EVERY_MS = 15000;
    const MAX_DEPARTURES = 3;

    const departuresList = document.getElementById("departuresList");
    const statusEl = document.getElementById("status");
    const updatedEl = document.getElementById("updated");

    async function loadDepartures() {
      try {
        statusEl.textContent = "Fetching live departures…";

        const response = await fetch(API_URL, {
          cache: "no-store"
        });

        if (!response.ok) {
          throw new Error(`API returned HTTP ${response.status}`);
        }

        const data = await response.json();

        if (!data.ok) {
          throw new Error(data.error || "API returned ok: false");
        }

        renderDepartures(data.departures || []);

        const generatedAt = data.generatedAt
          ? new Date(data.generatedAt)
          : new Date();

        updatedEl.textContent = `Updated ${generatedAt.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        })}`;

      } catch (error) {
        console.error(error);

        departuresList.innerHTML = `
          <div class="error">
            Could not load departures
          </div>
        `;

        statusEl.textContent = "Connection error";
        updatedEl.textContent = "Updated: —";
      }
    }

    function renderDepartures(departures) {
      const validDepartures = departures
        .filter(d => d && d.expectedDeparture)
        .sort((a, b) => {
          return new Date(a.expectedDeparture) - new Date(b.expectedDeparture);
        })
        .slice(0, MAX_DEPARTURES);

      statusEl.textContent = `${validDepartures.length} next departures`;

      if (validDepartures.length === 0) {
        departuresList.innerHTML = `
          <div class="empty">
            No live departures right now
          </div>
        `;
        return;
      }

      departuresList.innerHTML = validDepartures.map(departure => {
        const expected = new Date(departure.expectedDeparture);
        const minutes = getMinutesAway(expected);

        const route = departure.route || "—";
        const routeClass = isNRoute(route) ? "n-route" : "";
        const destination = formatDestination(departure.destination);
        const platform = formatPlatform(departure);
        const expectedTime = expected.toLocaleTimeString([], {
          hour: "2-digit",
          minute: "2-digit"
        });

        return `
          <div class="row">
            <div class="route ${routeClass}">${escapeHtml(route)}</div>

            <div class="main">
              <div class="destination">${escapeHtml(destination)}</div>
              <div class="details">${escapeHtml(platform)} • ${escapeHtml(expectedTime)}</div>
            </div>

            <div class="mins ${minutes <= 1 ? "due" : ""}">
              ${formatMinutes(minutes)}
            </div>
          </div>
        `;
      }).join("");
    }

    function isNRoute(route) {
      return String(route).trim().toUpperCase() === "N";
    }

    function formatDestination(destination) {
      const text = String(destination || "Unknown").trim();
      const lower = text.toLowerCase();

      if (lower.includes("la playa")) {
        return "Ocean Beach";
      }

      if (
        lower.includes("4th") &&
        (lower.includes("king") || lower.includes("king st"))
      ) {
        return "Caltrain/Ballpark";
      }

      return text;
    }

    function getMinutesAway(date) {
      const diffMs = date.getTime() - Date.now();
      return Math.max(0, Math.round(diffMs / 60000));
    }

    function formatMinutes(minutes) {
      if (minutes <= 0) return "Due";
      if (minutes === 1) return "1 min";
      return `${minutes} min`;
    }

    function formatPlatform(departure) {
      const route = String(departure.route || "").toUpperCase();

      if (route.includes("BUS") || route.includes("OWL")) {
        return "BUS";
      }

      if (departure.platform) {
        return departure.platform;
      }

      if (departure.stopId === "15206") {
        return "Outbound";
      }

      if (departure.stopId === "15205") {
        return "Inbound";
      }

      return "—";
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    loadDepartures();
    setInterval(loadDepartures, REFRESH_EVERY_MS);
  </script>
</body>
</html>
